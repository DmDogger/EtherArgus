[project]
name = "ether-ml-fraud"
version = "0.1.0"
description = ""
authors = [
    {name = "Dmitrii Kotik",email = "dmdoggx@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp (>=3.13.5,<4.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "pydantic (>=2.13.3,<3.0.0)",
    "stamina (>=26.1.0,<27.0.0)",
    "dishka (>=1.10.1,<2.0.0)",
    "structlog (>=25.5.0,<26.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "scikit-learn (==1.6.1)",
    "xgboost (>=3.2.0,<4.0.0)",
    "prometheus-client (>=0.25.0,<0.26.0)",
    "faststream[kafka] (>=0.6.7,<0.7.0)",
    "jsonpickle (>=4.1.1,<5.0.0)",
    "testcontainers (>=4.14.2,<5.0.0)",
    "sqlalchemy[asyncio] (>=2.0.50,<3.0.0)",
    "asyncpg (>=0.30.0,<1.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
]

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pandas-stubs (>=3.0.0.260204,<4.0.0.0)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
